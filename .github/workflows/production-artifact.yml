name: Production Artifact Build (Zero-Shell cPanel)

on:
  push:
    tags:
      - 'v*'
      - '*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag or Version Name (e.g. v1.0.0)'
        required: false
        default: 'manual'

permissions:
  contents: write

jobs:
  build-production-artifact:
    name: Build & Package Static & PHP Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Tag is on main Branch
        if: github.event_name == 'push'
        run: |
          echo "Memverifikasi apakah tag '${{ github.ref_name }}' (commit ${{ github.sha }}) berada di branch 'main'..."
          git fetch origin main --depth=1000
          if git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "✅ Terverifikasi: Tag berada pada riwayat commit branch 'main'."
          else
            echo "❌ Error: Tag '${{ github.ref_name }}' tidak dibuat dari branch 'main'."
            exit 1
          fi

      - name: Determine Version Name
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          else
            TAG_NAME="${{ github.ref_name }}"
          fi
          # Sanitize tag name
          CLEAN_TAG=$(echo "$TAG_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "RELEASE_NAME=saptara-production-${CLEAN_TAG}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV

      - name: Setup Node.js (Static Build)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Static Frontend Assets (React + Tailwind via Vite)
        run: |
          echo "Mengompilasi aset aplikasi React menjadi bundle statis..."
          npm run build
          
          # Verifikasi file manifest dan aset statis hasil kompilasi
          if [ ! -f "public/build/manifest.json" ]; then
            echo "❌ Error: File public/build/manifest.json tidak ditemukan setelah proses build!"
            exit 1
          fi
          echo "✅ Aset statis berhasil dikompilasi ke folder public/build/:"
          ls -lh public/build/assets/

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, gd, zip, bcmath
          coverage: none

      - name: Install Composer Dependencies (Production Mode)
        run: |
          echo "Mengunduh dan mengoptimasi dependensi PHP untuk produksi..."
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Package Production Artifact (Zero-Shell Ready)
        run: |
          STAGING_DIR="dist/${RELEASE_NAME}"
          mkdir -p "${STAGING_DIR}"

          echo "1. Menyalin direktori aplikasi utama..."
          cp -r app bootstrap config database public resources routes artisan composer.json composer.lock .env.example .env.cpanel.example DEPLOY.md "${STAGING_DIR}/"
          cp -r vendor "${STAGING_DIR}/"

          # Salin root .htaccess jika ada
          if [ -f ".htaccess" ]; then
            cp .htaccess "${STAGING_DIR}/.htaccess"
          fi

          # Pastikan file hot (HMR dev mode) tidak terikut agar server selalu membaca aset statis
          rm -f "${STAGING_DIR}/public/hot"

          echo "2. Generate random APP_KEY untuk kemudahan deploy di cPanel..."
          GENERATED_KEY=$(php -r "echo 'base64:' . base64_encode(random_bytes(32));")
          sed -i "s|APP_KEY=.*|APP_KEY=${GENERATED_KEY}|g" "${STAGING_DIR}/.env.cpanel.example"

          echo "3. Menyiapkan struktur direktori storage yang bersih..."
          mkdir -p "${STAGING_DIR}/storage/app/public"
          mkdir -p "${STAGING_DIR}/storage/framework/cache/data"
          mkdir -p "${STAGING_DIR}/storage/framework/sessions"
          mkdir -p "${STAGING_DIR}/storage/framework/views"
          mkdir -p "${STAGING_DIR}/storage/logs"

          touch "${STAGING_DIR}/storage/logs/.gitignore"
          touch "${STAGING_DIR}/storage/framework/cache/.gitignore"
          touch "${STAGING_DIR}/storage/framework/sessions/.gitignore"
          touch "${STAGING_DIR}/storage/framework/views/.gitignore"

          # Bersihkan cache file sisa proses build lokal
          rm -f "${STAGING_DIR}/bootstrap/cache/"*.php

          echo "4. Mengompresi paket produksi ke format .zip dan .tar.gz..."
          cd dist
          zip -r "${RELEASE_NAME}.zip" "${RELEASE_NAME}"
          tar -czf "${RELEASE_NAME}.tar.gz" "${RELEASE_NAME}"
          cd ..

          echo "Ukuran artefak produksi yang siap di-deploy tanpa Node/Shell:"
          ls -lh dist/${RELEASE_NAME}.*

      - name: Upload Production Artifact (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_NAME }}-zip
          path: dist/${{ env.RELEASE_NAME }}.zip
          retention-days: 90

      - name: Upload Production Artifact (.tar.gz)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_NAME }}-tar-gz
          path: dist/${{ env.RELEASE_NAME }}.tar.gz
          retention-days: 90

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ env.RELEASE_NAME }}.zip
            dist/${{ env.RELEASE_NAME }}.tar.gz
          name: Release ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
