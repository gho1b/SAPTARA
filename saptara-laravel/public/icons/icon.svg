<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Circle / Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#oceanGrad)" />

  <!-- Outer Ring with Compass Dots -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4" stroke-dasharray="8,8" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.6" />

  <!-- 7 Star Habit Emblems around compass -->
  <g fill="#fde047" opacity="0.9">
    <polygon points="256,76 261,90 275,90 264,99 268,113 256,104 244,113 248,99 237,90 251,90" />
    <polygon points="390,140 395,154 409,154 398,163 402,177 390,168 378,177 382,163 371,154 385,154" />
    <polygon points="436,256 441,270 455,270 444,279 448,293 436,284 424,293 428,279 417,270 431,270" />
    <polygon points="390,372 395,386 409,386 398,395 402,409 390,400 378,409 382,395 371,386 385,386" />
    <polygon points="256,436 261,450 275,450 264,459 268,473 256,464 244,473 248,459 237,450 251,450" />
    <polygon points="122,372 127,386 141,386 130,395 134,409 122,400 110,409 114,395 103,386 117,386" />
    <polygon points="76,256 81,270 95,270 84,279 88,293 76,284 64,293 68,279 57,270 71,270" />
  </g>

  <!-- Big Central Pinisi Sailing Ship -->
  <g filter="url(#shadow)" transform="translate(0, 10)">
    <!-- Ship Hull -->
    <path d="M120 310 C160 380, 350 380, 392 310 L120 310 Z" fill="#b45309" stroke="#78350f" stroke-width="4" />
    <path d="M140 310 C175 365, 335 365, 372 310 L140 310 Z" fill="#d97706" />

    <!-- Wave Crests -->
    <path d="M80 345 Q130 315, 180 345 T280 345 T380 345 T440 345" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
    <path d="M100 365 Q150 340, 200 365 T300 365 T400 365" fill="none" stroke="#e0f2fe" stroke-width="6" stroke-linecap="round" />

    <!-- Ship Mast -->
    <line x1="256" y1="130" x2="256" y2="310" stroke="#78350f" stroke-width="8" stroke-linecap="round" />
    <line x1="190" y1="170" x2="190" y2="310" stroke="#78350f" stroke-width="6" stroke-linecap="round" />

    <!-- Big Center Sail -->
    <path d="M260 140 Q340 210, 260 280 L260 140 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="3" />
    <path d="M260 150 Q325 210, 260 270" fill="none" stroke="#38bdf8" stroke-width="4" />

    <!-- Left Front Sail -->
    <path d="M186 180 Q130 230, 186 285 L186 180 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="3" />

    <!-- Flag on Mast -->
    <path d="M256 130 L290 142 L256 154 Z" fill="#ef4444" />
  </g>

  <!-- Title Text Ribbon -->
  <rect x="146" y="400" width="220" height="42" rx="21" fill="#0f172a" opacity="0.8" />
  <text x="256" y="428" font-family="sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">SAPTARA</text>
</svg>
